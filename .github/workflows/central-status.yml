name: Central deployment status

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Maven Central deployment id (printed by the publish-maven job)
        required: true

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Query deployment status
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          curl -sS -X POST -H "Authorization: Bearer $token" \
            "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}" | python3 -m json.tool
