server:
  port: 8090

spring:
  application:
    name: beanguard-demo
  profiles:
    active: memory
  messages:
    fallback-to-system-locale: false

beanguard:
  server:
    url: ${BEANGUARD_SERVER_URL:http://localhost:8000}
    public-key: ${BEANGUARD_SERVER_PUBLIC_KEY:}
    secret-key: ${BEANGUARD_SERVER_SECRET_KEY:}
  storage-path: ./beanguard-demo-data
