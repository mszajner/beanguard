<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{demo.title}">BeanGuard Demo</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; color: #1f2933; background: #f8fafc; }
        h1 { font-size: 1.5rem; display: inline-block; margin-right: 1rem; }
        .lang-switcher { font-size: 0.9rem; }
        .lang-switcher a { color: #2563eb; text-decoration: none; margin-right: 0.5rem; }
        .lang-switcher a.active { color: #1f2933; font-weight: 600; text-decoration: none; pointer-events: none; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1.5rem; margin-top: 1rem; }
        .status { font-size: 0.9rem; color: #64748b; margin-bottom: 1rem; }
        .error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
        label { display: block; font-weight: 600; margin-top: 1rem; }
        input[type=text], input[type=email], input[type=password], textarea { width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; }
        .field-error { color: #b91c1c; font-size: 0.85rem; margin-top: 0.25rem; }
        summary { font-weight: 600; cursor: pointer; }
        .hint { font-size: 0.85rem; color: #64748b; margin-top: 0.5rem; }
        button, .btn { display: inline-block; margin-top: 1.5rem; margin-right: 0.75rem; padding: 0.6rem 1.2rem; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; }
        button.secondary { background: #475569; }
        dl { display: grid; grid-template-columns: 10rem 1fr; row-gap: 0.5rem; column-gap: 1rem; margin: 0; }
        dt { font-weight: 600; color: #475569; }
        dd { margin: 0; }
        .claims-list { list-style: none; padding: 0; margin: 0; }
    </style>
</head>
<body>
<h1 th:text="#{demo.title}">BeanGuard Demo</h1>
<span class="lang-switcher">
    <a th:href="@{/(lang='en')}" th:classappend="${#locale.language == 'en'} ? 'active'" th:text="#{demo.lang.en}">English</a>
    <a th:href="@{/(lang='pl')}" th:classappend="${#locale.language == 'pl'} ? 'active'" th:text="#{demo.lang.pl}">Polski</a>
</span>

<div class="error" th:if="${error}" th:text="${error}"></div>

<details class="card">
    <summary th:text="#{demo.serverConfig.title}">Server connection</summary>
    <form th:action="@{/server-config}" th:object="${serverConfigForm}" method="post">
        <label for="serverUrl" th:text="#{demo.serverConfig.url}">Server URL</label>
        <input type="text" id="serverUrl" th:field="*{url}"/>
        <div class="field-error" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></div>

        <label for="serverPublicKey" th:text="#{demo.serverConfig.publicKey}">Public key</label>
        <textarea id="serverPublicKey" th:field="*{publicKey}" rows="3"></textarea>
        <div class="field-error" th:if="${#fields.hasErrors('publicKey')}" th:errors="*{publicKey}"></div>

        <label for="serverSecretKey" th:text="#{demo.serverConfig.secretKey}">Secret key</label>
        <input type="password" id="serverSecretKey" th:field="*{secretKey}"/>
        <div class="field-error" th:if="${#fields.hasErrors('secretKey')}" th:errors="*{secretKey}"></div>

        <button type="submit" th:text="#{demo.serverConfig.save}">Save &amp; reconnect</button>
    </form>
    <p class="hint" th:text="#{demo.serverConfig.warning}"></p>
</details>

<div class="card" th:if="${licence == null and pendingTransfer == null}">
    <p class="status" th:switch="${status.name()}">
        <span th:case="'MISSING_KEY'" th:text="#{demo.status.missingKey}"></span>
        <span th:case="'EXPIRED'" th:text="#{demo.status.expired}"></span>
        <span th:case="'WRONG_KEY'" th:text="#{demo.status.wrongKey}"></span>
        <span th:case="'WRONG_SECRET'" th:text="#{demo.status.wrongSecret}"></span>
        <span th:case="*" th:text="#{demo.status.default}"></span>
    </p>
    <form th:action="@{/demo-licence}" th:object="${form}" method="post">
        <label for="email" th:text="#{demo.form.email}">Email</label>
        <input type="email" id="email" th:field="*{email}"/>
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label for="vatId" th:text="#{demo.form.vatId}">VAT ID</label>
        <input type="text" id="vatId" th:field="*{vatId}"/>
        <div class="field-error" th:if="${#fields.hasErrors('vatId')}" th:errors="*{vatId}"></div>

        <button type="submit" th:text="#{demo.form.generate}">Generate demo licence</button>
    </form>
</div>

<div class="card" th:if="${licence == null and pendingTransfer == null}">
    <p class="status" th:text="#{demo.transfer.prompt}"></p>
    <form th:action="@{/transfer}" th:object="${transferForm}" method="post">
        <label for="licenceKey" th:text="#{demo.form.licenceKey}">Licence key</label>
        <input type="text" id="licenceKey" th:field="*{licenceKey}"/>
        <div class="field-error" th:if="${#fields.hasErrors('licenceKey')}" th:errors="*{licenceKey}"></div>

        <button type="submit" class="secondary" th:text="#{demo.form.transfer}">Transfer licence</button>
    </form>
</div>

<div class="card" th:if="${pendingTransfer != null}">
    <p class="status" th:text="#{demo.pending.info}"></p>
    <dl>
        <dt th:text="#{demo.pending.licenceKey}">Licence key</dt>
        <dd th:text="${pendingTransfer.licenceKey()}"></dd>
        <dt th:text="#{demo.pending.expiresAt}">Token expires</dt>
        <dd th:text="${pendingTransfer.expiresAt()}"></dd>
    </dl>
    <form th:action="@{/transfer/check}" method="post" style="display: inline;">
        <button type="submit" th:text="#{demo.pending.check}">Check status</button>
    </form>
    <form th:action="@{/transfer/cancel}" method="post" style="display: inline;">
        <button type="submit" class="secondary" th:text="#{demo.pending.cancel}">Cancel</button>
    </form>
</div>

<div class="card" th:if="${licence != null}">
    <dl>
        <dt th:text="#{demo.licence.key}">Key</dt>
        <dd th:text="${licence.key}"></dd>
        <dt th:text="#{demo.licence.companyName}">Company</dt>
        <dd th:text="${licence.companyName}"></dd>
        <dt th:text="#{demo.licence.address}">Address</dt>
        <dd th:if="${licence.street != null}" th:text="${licence.street} + ', ' + ${licence.postCode} + ' ' + ${licence.city}"></dd>
        <dd th:if="${licence.street == null}">—</dd>
        <dt th:text="#{demo.licence.vatId}">VAT ID</dt>
        <dd th:text="${licence.vatId}"></dd>
        <dt th:text="#{demo.licence.email}">Email</dt>
        <dd th:text="${licence.email}"></dd>
        <dt th:text="#{demo.licence.phoneNumber}">Phone</dt>
        <dd th:text="${licence.phoneNumber}"></dd>
        <dt th:text="#{demo.licence.type}">Type</dt>
        <dd th:text="${licence.type}"></dd>
        <dt th:text="#{demo.licence.netAmount}">Net amount</dt>
        <dd th:text="${licence.netAmount}"></dd>
        <dt th:text="#{demo.licence.expiration}">Valid until</dt>
        <dd th:text="${licence.expiration}"></dd>
    </dl>

    <h3 th:text="#{demo.licence.claimsTitle}">Claims</h3>
    <ul class="claims-list">
        <li th:each="claim : ${licence.claims}" th:text="${claim.key} + ': ' + ${claim.value}"></li>
        <li th:if="${licence.claims == null or #maps.isEmpty(licence.claims)}" th:text="#{demo.licence.noClaims}"></li>
    </ul>

    <a class="btn" th:href="@{/extend}" target="_blank" th:text="#{demo.licence.extend}">Extend licence</a>
    <form th:action="@{/refresh}" method="post" style="display: inline;">
        <button type="submit" class="secondary" th:text="#{demo.licence.refresh}">Refresh licence</button>
    </form>
</div>
</body>
</html>
