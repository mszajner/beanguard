spring:
  datasource:
    url: 'jdbc:postgresql://localhost/app'
    username: 'app'
    password: 'app'
    driverClassName: 'org.postgresql.Driver'
  jpa:
    database-platform: 'org.hibernate.dialect.PostgreSQLDialect'
    hibernate:
      ddl-auto: none
    show_sql: true
    open-in-view: false
  liquibase:
    change-log: 'classpath:db/changelog/db.changelog.yml'

server:
  port: 8000
  # Resolve the client address from X-Forwarded-For only when the peer is a trusted proxy
  # (private ranges by default, see server.tomcat.remoteip.internal-proxies).
  forward-headers-strategy: native

beanguard:
  server:
    url: '${BEANGUARD_SERVER_URL:http://localhost:8000}'
  admin:
    url: '${BEANGUARD_ADMIN_URL:http://localhost:8002}'
  shop:
    url: '${BEANGUARD_SHOP_URL:http://localhost:8001}'
