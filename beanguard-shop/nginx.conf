server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Extension-less paths are client-side routes (React Router) - fall back
    # to index.html. Paths with a dot (missing assets, typos) fall through
    # to the block below and get a real 404 instead of silently serving the
    # SPA shell.
    location ~ ^/[^.]*$ {
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri =404;
    }
}
